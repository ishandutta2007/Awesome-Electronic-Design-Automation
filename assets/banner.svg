<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0284c7"/></linearGradient><linearGradient id="accent" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="grid" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".05"/><stop offset="100%" stop-color="#c084fc" stop-opacity=".15"/></linearGradient><filter id="glow"><feGaussianBlur result="coloredBlur" stdDeviation="3"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(1)}50%{opacity:.8;transform:scale(1.05)}}@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,sans-serif}.title{font-weight:900;font-size:46px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#38bdf8}.pulse-elem{animation:pulse 4s infinite ease-in-out;transform-origin:center}.signal-line{stroke-dasharray:8,8;animation:dash 2s linear infinite}.floating-card{animation:float 5s infinite ease-in-out}</style><rect width="1200" height="320" fill="url(#bg)" rx="16"/><rect width="1200" height="320" fill="url(#grid)" rx="16"/><g fill="none" stroke="#38bdf8" stroke-opacity=".25" stroke-width="2"><path d="M 750 60 H 900 L 960 120 V 220 L 1020 280 H 1150"/><path d="M 800 280 H 880 L 940 220 V 100 L 1000 40 H 1120"/><path d="M 700 160 H 840 L 900 100 V 50"/></g><g fill="none" stroke="#818cf8" stroke-width="2" class="signal-line"><path d="M 750 60 H 900 L 960 120 V 220 L 1020 280 H 1150"/><path d="M 800 280 H 880 L 940 220 V 100 L 1000 40 H 1120"/></g><circle cx="900" cy="60" r="6" fill="#38bdf8" class="pulse-elem" filter="url(#glow)"/><circle cx="960" cy="120" r="5" fill="#818cf8" class="pulse-elem"/><circle cx="940" cy="220" r="7" fill="#c084fc" class="pulse-elem" filter="url(#glow)"/><circle cx="1020" cy="280" r="5" fill="#38bdf8" class="pulse-elem"/><g class="floating-card" transform="translate(920, 100)"><rect width="160" height="120" x="0" y="0" fill="#0f172a" fill-opacity=".8" stroke="#818cf8" stroke-width="2" rx="10"/><line x1="-12" x2="0" y1="30" y2="30" stroke="#38bdf8" stroke-width="3"/><line x1="-12" x2="0" y1="60" y2="60" stroke="#38bdf8" stroke-width="3"/><line x1="-12" x2="0" y1="90" y2="90" stroke="#38bdf8" stroke-width="3"/><line x1="160" x2="172" y1="30" y2="30" stroke="#38bdf8" stroke-width="3"/><line x1="160" x2="172" y1="60" y2="60" stroke="#38bdf8" stroke-width="3"/><line x1="160" x2="172" y1="90" y2="90" stroke="#38bdf8" stroke-width="3"/><rect width="110" height="80" x="25" y="20" fill="none" stroke="#c084fc" stroke-dasharray="4 4" stroke-width="1.5" rx="6"/><text x="80" y="55" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SILICON / PCB</text><text x="80" y="75" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle">EDA FLOWS</text></g><g><g transform="translate(60, 0) translate(0, 50)"><rect width="310" height="32" x="0" y="0" fill="#1e293b" stroke="#38bdf8" stroke-width="1" rx="16"/><text x="15" y="21" class="badge-text">⚡ CURATED EDA HARDWARE STACK</text></g><text x="0" y="135" class="title" transform="translate(60, 0)">Awesome Electronic<tspan fill="url(#accent)"> Design Automation</tspan></text><text x="0" y="180" class="subtitle" transform="translate(60, 0)">Top IC Design, PCB Layout, SPICE Simulation &amp; Open-Silicon Ecosystems</text><g transform="translate(60, 0) translate(0, 225)"><rect width="130" height="30" x="0" y="0" fill="#0f172a" stroke="#475569" str