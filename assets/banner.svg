<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="grid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    .pulse-elem { animation: pulse 4s infinite ease-in-out; transform-origin: center; }
    .signal-line { stroke-dasharray: 8, 8; animation: dash 2s linear infinite; }
    .floating-card { animation: float 5s infinite ease-in-out; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Dynamic / Animated Circuit Graphics in Background (Right side & Subtle BG) -->
  <g stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2" fill="none">
    <path d="M 750 60 H 900 L 960 120 V 220 L 1020 280 H 1150" />
    <path d="M 800 280 H 880 L 940 220 V 100 L 1000 40 H 1120" />
    <path d="M 700 160 H 840 L 900 100 V 50" />
  </g>
  
  <g stroke="#818cf8" stroke-width="2" fill="none" class="signal-line">
    <path d="M 750 60 H 900 L 960 120 V 220 L 1020 280 H 1150" />
    <path d="M 800 280 H 880 L 940 220 V 100 L 1000 40 H 1120" />
  </g>

  <!-- Dynamic Glowing Nodes -->
  <circle cx="900" cy="60" r="6" fill="#38bdf8" class="pulse-elem" filter="url(#glow)"/>
  <circle cx="960" cy="120" r="5" fill="#818cf8" class="pulse-elem"/>
  <circle cx="940" cy="220" r="7" fill="#c084fc" class="pulse-elem" filter="url(#glow)"/>
  <circle cx="1020" cy="280" r="5" fill="#38bdf8" class="pulse-elem"/>

  <!-- Background Microchip Graphic (Right side) -->
  <g transform="translate(920, 100)" class="floating-card">
    <rect x="0" y="0" width="160" height="120" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="2" fill-opacity="0.8"/>
    <!-- Chip Pins -->
    <line x1="-12" y1="30" x2="0" y2="30" stroke="#38bdf8" stroke-width="3"/>
    <line x1="-12" y1="60" x2="0" y2="60" stroke="#38bdf8" stroke-width="3"/>
    <line x1="-12" y1="90" x2="0" y2="90" stroke="#38bdf8" stroke-width="3"/>
    <line x1="160" y1="30" x2="172" y2="30" stroke="#38bdf8" stroke-width="3"/>
    <line x1="160" y1="60" x2="172" y2="60" stroke="#38bdf8" stroke-width="3"/>
    <line x1="160" y1="90" x2="172" y2="90" stroke="#38bdf8" stroke-width="3"/>
    
    <rect x="25" y="20" width="110" height="80" rx="6" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="80" y="55" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0" text-anchor="middle">SILICON / PCB</text>
    <text x="80" y="75" font-family="sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">EDA FLOWS</text>
  </g>

  <!-- Foreground Foreground Content (Title, Subtitle, Pill Badge) -->
  <g transform="translate(60, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="310" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="15" y="21" class="badge-text">⚡ CURATED EDA HARDWARE STACK</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" class="title">
      Awesome Electronic<tspan fill="url(#accent)"> Design Automation</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="180" class="subtitle">
      Top IC Design, PCB Layout, SPICE Simulation &amp; Open-Silicon Ecosystems
    </text>

    <!-- Tech Badges -->
    <g transform="translate(0, 225)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="130" height="30" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="65" y="19" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="bold" text-anchor="middle">🎛️ IC Design</text>

      <!-- Badge 2 -->
      <rect x="145" y="0" width="130" height="30" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="210" y="19" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="bold" text-anchor="middle">🔌 PCB Layout</text>

      <!-- Badge 3 -->
      <rect x="290" y="0" width="150" height="30" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="365" y="19" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="bold" text-anchor="middle">📊 SPICE Simulation</text>

      <!-- Badge 4 -->
      <rect x="455" y="0" width="145" height="30" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="527" y="19" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="bold" text-anchor="middle">💎 Open PDKs</text>
    </g>
  </g>
</svg>
